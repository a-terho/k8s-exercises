apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
  namespace: exercises
spec:
  replicas: 1
  strategy: # remove old pods before creating new ones
    type: Recreate
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: persistent-files
          persistentVolumeClaim:
            claimName: gke-dynamic-pvc
      containers:
        - name: ping-pong
          image: PINGPONG_APP_IMAGE
          env:
            - name: PORT
              value: '3001'
            - name: DATABASE_HOST
              # format is stateful-set.parent-service.namespace.svc.cluster.local
              value: 'postgres-ss-0.postgres-svc.exercises.svc.cluster.local'
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: persistent-files
              mountPath: /usr/src/app/files
              subPath: ping-pong
          readinessProbe:
            httpGet:
              path: '/readyz'
              port: 3001
