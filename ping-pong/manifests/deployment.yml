apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: alterho/ping-pong:5.3
          env:
            - name: PORT
              value: '3001'
            - name: DATABASE_HOST
              # format is stateful-set.parent-service.namespace.svc.cluster.local
              value: 'postgres-ss-0.postgres-svc.exercises.svc.cluster.local'
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
