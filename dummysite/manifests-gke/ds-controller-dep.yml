apiVersion: apps/v1
kind: Deployment
metadata:
  name: ds-controller-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummysite-controller
  template:
    metadata:
      labels:
        app: dummysite-controller
    spec:
      serviceAccountName: ds-controller-account
      containers:
        - name: dummysite-controller
          image: alterho/ds-controller:5.1
