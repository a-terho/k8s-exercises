name: Release broadcaster

on:
  push:
    branches: ['**'] # only trigger for branches, not tags
    paths: ['broadcaster/**']

# These are apparently required for Google Cloud Auth and Setup
permissions:
  contents: read
  id-token: write

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest

    # Use environment scoped variables and secrets
    environment: GKE_PROJECT
    env:
      PROJECT_ID: '${{ secrets.GKE_PROJECT_ID }}'
      GKE_CLUSTER: dwk-cluster
      GKE_ZONE: europe-north1-b
      REGISTRY: europe-north1-docker.pkg.dev
      REPOSITORY: docker-images
      MAIN_NAMESPACE: project
      IMAGE: broadcaster
      DEPLOYMENT: broadcaster-dep
      BRANCH: '${{ github.ref_name }}'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.SERVICE_ACCOUNT }}'

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Use gcloud CLI'
        run: gcloud info

      - name: 'Configure Docker authentication with gcloud CLI'
        run: gcloud auth configure-docker "$REGISTRY"

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: 'Form the image name and save to environment'
        run: echo "IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE:$BRANCH-$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Build
        working-directory: broadcaster
        run: docker build --tag "$IMAGE_TAG" .

      - name: Publish
        working-directory: broadcaster
        run: docker push "$IMAGE_TAG"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Initialize namespace
        run: |-
          if [ "$BRANCH" = "main" ]; then
            K8S_NAMESPACE="$MAIN_NAMESPACE"
          else
            K8S_NAMESPACE="$BRANCH"
          fi
          echo "K8S_NAMESPACE=$K8S_NAMESPACE" >> "$GITHUB_ENV"
          kubectl create namespace "$K8S_NAMESPACE" || true
          kubectl config set-context --current --namespace="$K8S_NAMESPACE"

      - name: Setup SOPS
        uses: nhedger/setup-sops@v2

      - name: Decrypt and deploy
        working-directory: broadcaster
        run: |-
          kustomize edit set namespace "$K8S_NAMESPACE"
          kustomize edit set image BROADCASTER_IMAGE="$IMAGE_TAG"
          sops --decrypt manifests-gke/secret.enc.yml > manifests-gke/secret.yml
          kustomize build . | kubectl apply -f -
          rm manifests-gke/secret.yml
          kubectl rollout status deployment "$DEPLOYMENT" -n "$K8S_NAMESPACE"
          kubectl get services -o wide -n "$K8S_NAMESPACE"
