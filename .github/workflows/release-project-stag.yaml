name: Release project (staging)

on:
  push:
    branches: ['main']
    # paths:
    #   - 'broadcaster/**'
    #   - 'todo-app/**'
    #   - 'todo-backend/**'

env:
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: docker-images
  RELEASE_TAG: 'main-${{ github.sha }}'

jobs:
  build-publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    # Use environment scoped variables and secrets
    environment: GKE_PROJECT
    env:
      PROJECT_ID: '${{ vars.GKE_PROJECT_ID }}'

    # These are apparently required for Google Cloud Auth and Setup
    permissions:
      contents: read
      id-token: write

    # Specify outputs used in the dependent job
    outputs:
      BROADCASTER_IMAGE: ${{ steps.image.outputs.BROADCASTER_IMAGE }}
      TODO_APP_IMAGE: ${{ steps.image.outputs.TODO_APP_IMAGE }}
      TODO_BACKEND_IMAGE: ${{ steps.image.outputs.TODO_BACKEND_IMAGE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.SERVICE_ACCOUNT }}'

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Configure Docker authentication with gcloud CLI'
        run: gcloud auth configure-docker "$REGISTRY"

      - name: Form the image names and save to environment
        id: image
        run: |-
          BROADCASTER_IMAGE="$REGISTRY/$PROJECT_ID/$REPOSITORY/broadcaster"
          TODO_APP_IMAGE="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app"
          TODO_BACKEND_IMAGE="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend"
          echo "BROADCASTER_IMAGE=$BROADCASTER_IMAGE" >> "$GITHUB_ENV"
          echo "BROADCASTER_IMAGE=$BROADCASTER_IMAGE" >> "$GITHUB_OUTPUT"
          echo "TODO_APP_IMAGE=$TODO_APP_IMAGE" >> "$GITHUB_ENV"
          echo "TODO_APP_IMAGE=$TODO_APP_IMAGE" >> "$GITHUB_OUTPUT"
          echo "TODO_BACKEND_IMAGE=$TODO_BACKEND_IMAGE" >> "$GITHUB_ENV"
          echo "TODO_BACKEND_IMAGE=$TODO_BACKEND_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build broadcaster
        working-directory: broadcaster
        run: docker build --tag "$BROADCASTER_IMAGE:$RELEASE_TAG" .

      - name: Build todo-app
        working-directory: todo-app
        run: docker build --tag "$TODO_APP_IMAGE:$RELEASE_TAG" .

      - name: Build todo-backend
        working-directory: todo-backend
        run: docker build --tag "$TODO_BACKEND_IMAGE:$RELEASE_TAG" .

      - name: Publish all
        run: |-
          docker push "$BROADCASTER_IMAGE:$RELEASE_TAG"
          docker push "$TODO_APP_IMAGE:$RELEASE_TAG"
          docker push "$TODO_BACKEND_IMAGE:$RELEASE_TAG"

  update-kustomization:
    name: Update kustomization.yaml
    runs-on: ubuntu-latest
    needs: build-publish

    # Use environment scoped variables and secrets
    environment: GKE_PROJECT

    # Load required environment variables from previous job
    env:
      BROADCASTER_IMAGE: '${{ needs.build-publish.outputs.BROADCASTER_IMAGE }}'
      TODO_APP_IMAGE: '${{ needs.build-publish.outputs.TODO_APP_IMAGE }}'
      TODO_BACKEND_IMAGE: '${{ needs.build-publish.outputs.TODO_BACKEND_IMAGE }}'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: a-terho/k8s-exercises-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main # update file on main branch

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Modify kustomization.yaml to use right images
        working-directory: overlays/staging
        run: |-
          kustomize edit set image "$BROADCASTER_IMAGE=$BROADCASTER_IMAGE:$RELEASE_TAG"
          kustomize edit set image "$TODO_APP_IMAGE=$TODO_APP_IMAGE:$RELEASE_TAG"
          kustomize edit set image "$TODO_BACKEND_IMAGE=$TODO_BACKEND_IMAGE:$RELEASE_TAG"

      - name: Commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          cwd: './overlays/staging'
          add: 'kustomization.yaml'
          message: New version of project-staging released ${{ github.sha }}
          push: origin main # push to the main branch
