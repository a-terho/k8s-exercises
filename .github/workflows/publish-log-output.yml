name: Build and publish log-output

on:
  push:
    branches: ['**'] # only trigger for branches, not tags
    paths: ['log-output/**']

jobs:
  build-publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      MAIN_NAMESPACE: exercises
      IMAGE: log-output
      BRANCH: '${{ github.ref_name }}'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 'Form the image names and save to environment'
        run: |-
          echo "LOGREAD_TAG=$DOCKERHUB_USERNAME/$IMAGE:$BRANCH-read-$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "LOGWRITE_TAG=$DOCKERHUB_USERNAME/$IMAGE:$BRANCH-write-$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish to Docker Hub
        working-directory: log-output
        run: |-
          docker build --tag "$LOGREAD_TAG" read
          docker build --tag "$LOGWRITE_TAG" write
          docker push "$LOGREAD_TAG"
          docker push "$LOGWRITE_TAG"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Initialize namespace
        run: |-
          if [ "$BRANCH" = "main" ]; then
            K8S_NAMESPACE="$MAIN_NAMESPACE"
          else
            K8S_NAMESPACE="$BRANCH"
          fi
          echo "K8S_NAMESPACE=$K8S_NAMESPACE" >> "$GITHUB_ENV"
          kubectl create namespace "$K8S_NAMESPACE" || true

      - name: Modify kustomization.yaml to use right namespace and images
        working-directory: log-output
        run: |-
          kustomize edit set namespace "$K8S_NAMESPACE"
          kustomize edit set image LOGREAD_APP_IMAGE="$LOGREAD_TAG"
          kustomize edit set image LOGWRITE_APP_IMAGE="$LOGWRITE_TAG"

      - name: Commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          cwd: './log-output'
          add: 'kustomization.yaml'
          message: New version released ${{ github.sha }}
