name: Release todo-app

on:
  push:
    branches: ['**'] # only trigger for branches, not tags
    paths: ['todo-app/**']

env:
  # GKE_CLUSTER: dwk-cluster
  # GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: docker-images
  MAIN_NAMESPACE: project
  IMAGE: todo-app
  DEPLOYMENT: todo-app-dep
  BRANCH: '${{ github.ref_name }}'

jobs:
  build-publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    # Use environment scoped secrets
    environment: GKE_PROJECT
    env:
      PROJECT_ID: '${{ secrets.GKE_PROJECT_ID }}'

    # These are apparently required for Google Cloud Auth and Setup
    permissions:
      contents: read
      id-token: write

    # Specify outputs used in the dependent job
    outputs:
      IMAGE_TAG: ${{ steps.image.outputs.IMAGE_TAG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.SERVICE_ACCOUNT }}'

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Configure Docker authentication with gcloud CLI'
        run: gcloud auth configure-docker "$REGISTRY"

      # - name: 'Get GKE credentials'
      #   uses: 'google-github-actions/get-gke-credentials@v3'
      #   with:
      #     cluster_name: '${{ env.GKE_CLUSTER }}'
      #     project_id: '${{ env.PROJECT_ID }}'
      #     location: '${{ env.GKE_ZONE }}'

      - name: Form the image name and save to environment
        id: image
        run: |-
          IMAGE_TAG="$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE:$BRANCH-$GITHUB_SHA"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: todo-app
        run: docker build --tag "$IMAGE_TAG" .

      - name: Publish
        working-directory: todo-app
        run: docker push "$IMAGE_TAG"

  update-kustomization:
    name: Update kustomization.yaml
    runs-on: ubuntu-latest
    needs: build-publish

    # Setup repository write permissions
    permissions:
      contents: write

    # Load required environment variables from previous job
    env:
      IMAGE_TAG: '${{ needs.build-publish.outputs.IMAGE_TAG }}'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Initialize namespace
        run: |-
          if [ "$BRANCH" = "main" ]; then
            K8S_NAMESPACE="$MAIN_NAMESPACE"
          else
            K8S_NAMESPACE="$BRANCH"
          fi
          echo "K8S_NAMESPACE=$K8S_NAMESPACE" >> "$GITHUB_ENV"

      - name: Modify kustomization.yaml to use right namespace and image
        working-directory: todo-app
        run: |-
          kustomize edit set namespace "$K8S_NAMESPACE"
          kustomize edit set image TODO_APP_IMAGE="$IMAGE_TAG"

      - name: Commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          cwd: './todo-app'
          add: 'kustomization.yaml'
          message: New version of todo-app released ${{ github.sha }}
