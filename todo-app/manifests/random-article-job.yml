apiVersion: batch/v1
kind: CronJob
metadata:
  name: post-random-article
  namespace: project
spec:
  schedule: '23 * * * *' # every hour at 23 minute mark
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: post-random-article
              image: busybox
              command:
                - /bin/sh
                - -c
                - | # posting happens only if backend service is available
                  echo 'Running cronjob'
                  if nc -z -w2 todo-backend-svc 1234 2>/dev/null; then
                    echo 'Backend available, sending random article link'
                    ARTICLE_LINK=$(wget -S -U "Mozilla/5.0 (compatible; test-script)" -O - https://en.wikipedia.org/wiki/Special:Random 2>&1 | grep "location:" | awk -F// '{print $NF}')
                    wget --post-data="{\"message\":\"Read https://$ARTICLE_LINK\"}" --header='Content-Type: application/json' -O - http://todo-backend-svc:1234/todos
                  fi
